<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Исторический Тест</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        /* ... (тут весь твой CSS, который я написал выше, он не менялся) ... */
        :root {
            --bg-color: #17212b; --text-color: #ffffff; --btn-bg: #232e3c;
            --btn-hover: #2b3a4a; --btn-correct: #31a24c; --btn-wrong: #e83e3e;
            --accent: #2481cc; --fire: #ff9800;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 16px; display: flex; flex-direction: column;
            justify-content: center; min-height: 100vh; user-select: none;
        }
        .screen { display: none; width: 100%; max-width: 500px; margin: 0 auto; }
        .screen.active { display: block; }
        .menu-title { text-align: center; font-size: 22px; margin-bottom: 20px; font-weight: bold; }
        .menu-btn {
            background-color: var(--btn-bg); color: var(--text-color); border: none;
            padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600;
            width: 100%; margin-bottom: 12px; cursor: pointer; transition: 0.2s;
        }
        .menu-btn:active { transform: scale(0.98); background-color: var(--btn-hover); }
        .menu-btn.infinite { background-color: var(--accent); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 15px; font-weight: 600; color: #7f91a4; }
        .fire-streak { color: var(--fire); display: none; font-size: 16px; }
        .fire-streak.active { display: block; }
        .question-box { background-color: var(--btn-bg); padding: 16px; border-radius: 12px; margin-bottom: 16px; text-align: center; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .question-text { font-size: 16px; font-weight: 600; line-height: 1.4; margin: 0; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background-color: var(--btn-bg); color: var(--text-color); border: none; padding: 14px 16px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; text-align: left; width: 100%; }
        .option-btn.correct { background-color: var(--btn-correct); }
        .option-btn.wrong { background-color: var(--btn-wrong); }
        .input-area { display: flex; gap: 10px; margin-top: 10px; }
        .year-input { flex: 1; background-color: var(--btn-bg); border: 1px solid #334155; color: white; padding: 14px; border-radius: 10px; font-size: 16px; outline: none; }
        .submit-btn { background-color: var(--accent); color: white; border: none; padding: 14px 20px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .sortable-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .sortable-item { background-color: var(--btn-bg); color: var(--text-color); padding: 14px 16px; border-radius: 10px; font-size: 15px; display: flex; align-items: center; gap: 10px; border: 1px solid #334155; }
        .drag-handle { color: #7f91a4; font-size: 18px; }
        .sortable-item.correct { border-color: var(--btn-correct); background-color: rgba(49, 162, 76, 0.2); }
        .sortable-item.wrong { border-color: var(--btn-wrong); background-color: rgba(232, 62, 62, 0.2); }
        .action-btn { background-color: var(--accent); color: white; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px; display: none; }
        .action-btn.active { display: block; }
        .result-box { text-align: center; }
        .pie-chart { width: 200px; height: 200px; border-radius: 50%; margin: 20px auto; background: conic-gradient(var(--btn-correct) 0% 0%, var(--btn-wrong) 0% 100%); display: flex; align-items: center; justify-content: center; }
        .pie-inner { width: 140px; height: 140px; background-color: var(--bg-color); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pie-score { font-size: 32px; font-weight: bold; }
        .pie-label { font-size: 14px; color: #7f91a4; }
        .stats { display: flex; justify-content: space-around; margin-top: 20px; font-size: 16px; }
        .stat-item span { display: block; font-size: 24px; font-weight: bold; margin-top: 5px; }
        .error-msg { color: var(--btn-wrong); text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="loading" class="screen active">Загрузка данных...</div>
    
    <div id="menu-screen" class="screen">
        <div class="menu-title">Выберите режим</div>
        <button class="menu-btn" onclick="startGame(10)">10 вопросов</button>
        <button class="menu-btn" onclick="startGame(15)">15 вопросов</button>
        <button class="menu-btn" onclick="startGame(20)">20 вопросов</button>
        <button class="menu-btn" onclick="startGame(25)">25 вопросов</button>
        <button class="menu-btn" onclick="startGame(30)">30 вопросов</button>
        <button class="menu-btn" onclick="startGame(35)">35 вопросов</button>
        <button class="menu-btn infinite" onclick="startGame(Infinity)">🔥 Бесконечный режим</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="top-bar">
            <div id="progress-text">Вопрос 1</div>
            <div id="streak-text" class="fire-streak">🔥 Серия: <span id="streak-count">0</span></div>
        </div>
        <div class="question-box"><h1 class="question-text" id="question">Вопрос</h1></div>
        <div class="options" id="options"></div>
        <button class="action-btn" id="next-btn" onclick="nextQuestion()">Следующий вопрос</button>
    </div>

    <div id="result-screen" class="screen">
        <div class="result-box">
            <div class="menu-title">Результат</div>
            <div class="pie-chart" id="pie">
                <div class="pie-inner">
                    <div class="pie-score" id="pie-score">0%</div>
                    <div class="pie-label">Правильно</div>
                </div>
            </div>
            <div class="stats">
                <div class="stat-item" style="color:var(--btn-correct)">Верно <span id="res-correct">0</span></div>
                <div class="stat-item" style="color:var(--btn-wrong)">Ошибки <span id="res-wrong">0</span></div>
            </div>
            <button class="menu-btn" style="margin-top: 30px;" onclick="showMenu()">В главное меню</button>
        </div>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQTn-CgZGj1yqA4AZE1oW3SrZQmnadfwAYSiPaIGFMK0r6TIFbP1gQ7RI9wK0DH9rIC_Ub1fYjPbGe5/pub?gid=0&single=true&output=csv";

        if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }

        let allData = [];
        let sortableInstance = null;
        let gameMode = 'infinite';
        let totalQuestions = 0;
        let currentQuestionIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let currentStreak = 0;

        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const matches = line.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);
                if (matches && matches.length >= 2) {
                    const year = matches[0].replace(/^"|"$/g, '').trim();
                    const event = matches[1].replace(/^"|"$/g, '').trim();
                    if (year && event) result.push({ year: year, event: event, numYear: parseInt(year) || 0 });
                }
            }
            return result;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // ИСПРАВЛЕННАЯ ФУНКЦИЯ ЗАГРУЗКИ
        async function loadData() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("Ошибка сети");
                const csvText = await response.text();
                allData = parseCSV(csvText);
                if (allData.length < 4) throw new Error("Мало данных.");
                
                // Вот тут мы показываем меню!
                switchScreen('menu-screen');
            } catch (error) {
                document.getElementById('loading').innerHTML = `<span class="error-msg">Ошибка: ${error.message}</span>`;
            }
        }

        function showMenu() { switchScreen('menu-screen'); document.getElementById('next-btn').classList.remove('active'); }

        function startGame(mode) {
            gameMode = mode;
            totalQuestions = mode === Infinity ? Infinity : mode;
            currentQuestionIndex = 0; correctCount = 0; wrongCount = 0; currentStreak = 0;
            updateStreakUI();
            document.getElementById('progress-text').innerText = gameMode === 'infinite' ? 'Бесконечный режим' : `Вопрос 1 / ${totalQuestions}`;
            switchScreen('game-screen');
            nextQuestion();
        }

        function updateStreakUI() {
            const streakEl = document.getElementById('streak-text');
            if (gameMode === Infinity) {
                streakEl.classList.add('active');
                document.getElementById('streak-count').innerText = currentStreak;
            } else streakEl.classList.remove('active');
        }

        function nextQuestion() {
            document.getElementById('next-btn').classList.remove('active');
            if (gameMode !== Infinity && currentQuestionIndex >= totalQuestions) return showResult();

            currentQuestionIndex++;
            if (gameMode !== Infinity) document.getElementById('progress-text').innerText = `Вопрос ${currentQuestionIndex} / ${totalQuestions}`;

            const questionEl = document.getElementById('question');
            const optionsEl = document.getElementById('options');
            optionsEl.innerHTML = '';
            if (sortableInstance) { sortableInstance.destroy(); sortableInstance = null; }

            const type = Math.floor(Math.random() * 4); 
            if (type === 0 || type === 1) generateQuizQuestion(type, questionEl, optionsEl);
            else if (type === 2) generateSortableQuestion(questionEl, optionsEl);
            else generateInputQuestion(questionEl, optionsEl);
        }

        function generateQuizQuestion(type, questionEl, optionsEl) {
            const correctItem = getRandom(allData);
            const wrongPool = allData.filter(item => item !== correctItem);
            let questionText = "", correctAnswer = "", wrongAnswers = [];

            if (type === 0) {
                questionText = `В каком году произошло событие:<br><br>"${correctItem.event}"?`;
                correctAnswer = correctItem.year;
                let attempts = 0;
                while (wrongAnswers.length < 3 && attempts < 100) {
                    const r = getRandom(wrongPool);
                    if (!wrongAnswers.includes(r.year) && r.year !== correctAnswer) wrongAnswers.push(r.year);
                    attempts++;
                }
            } else {
                questionText = `Что произошло в ${correctItem.year} году?`;
                correctAnswer = correctItem.event;
                let attempts = 0;
                while (wrongAnswers.length < 3 && attempts < 100) {
                    const r = getRandom(wrongPool);
                    if (!wrongAnswers.includes(r.event) && r.event !== correctAnswer) wrongAnswers.push(r.event);
                    attempts++;
                }
            }
            if (wrongAnswers.length < 3) return nextQuestion();

            questionEl.innerHTML = questionText;
            shuffle([correctAnswer, ...wrongAnswers]).forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.onclick = () => {
                    const isCorrect = optionText === correctAnswer;
                    optionsEl.querySelectorAll('.option-btn').forEach(b => { b.disabled = true; if (b.innerText === correctAnswer) b.classList.add('correct'); });
                    if (!isCorrect) btn.classList.add('wrong');
                    handleResult(isCorrect);
                };
                optionsEl.appendChild(btn);
            });
        }

        function generateSortableQuestion(questionEl, optionsEl) {
            questionEl.innerHTML = "Расставьте события по порядку:<br><span style='font-size:14px; color:#7f91a4'>от самого раннего к самому позднему</span>";
            const selectedItems = shuffle([...allData]).slice(0, 4);
            const listContainer = document.createElement('div');
            listContainer.className = 'sortable-list';
            shuffle([...selectedItems]).forEach(item => {
                const div = document.createElement('div');
                div.className = 'sortable-item';
                div.dataset.year = item.numYear;
                div.innerHTML = `<span class="drag-handle">≡</span> <span>${item.event}</span>`;
                listContainer.appendChild(div);
            });
            optionsEl.appendChild(listContainer);
            const checkBtn = document.createElement('button');
            checkBtn.className = 'submit-btn'; checkBtn.style.width = '100%'; checkBtn.innerText = 'Проверить';
            checkBtn.onclick = () => {
                checkBtn.style.display = 'none';
                const currentItems = Array.from(listContainer.children);
                const correctOrder = [...selectedItems].sort((a, b) => a.numYear - b.numYear);
                let allCorrect = true;
                currentItems.forEach((el, index) => {
                    if (parseInt(el.dataset.year) === correctOrder[index].numYear) el.classList.add('correct');
                    else { el.classList.add('wrong'); allCorrect = false; }
                });
                sortableInstance.option('disabled', true);
                handleResult(allCorrect);
            };
            optionsEl.appendChild(checkBtn);
            sortableInstance = new Sortable(listContainer, { animation: 150, handle: '.drag-handle' });
        }

        function generateInputQuestion(questionEl, optionsEl) {
            const item = getRandom(allData);
            questionEl.innerHTML = `Напишите год, в котором произошло событие:<br><br>"${item.event}"`;
            const inputArea = document.createElement('div'); inputArea.className = 'input-area';
            const input = document.createElement('input'); input.type = 'number'; input.className = 'year-input'; input.placeholder = 'Год';
            const btn = document.createElement('button'); btn.className = 'submit-btn'; btn.innerText = 'Ответить';
            input.addEventListener('keypress', (e) => { if (e.key === 'Enter') btn.click(); });
            btn.onclick = () => {
                if (!input.value) return;
                const isCorrect = input.value.trim() === item.year;
                input.disabled = true; btn.style.display = 'none';
                questionEl.innerHTML += isCorrect ? `<br><br><span style="color:var(--btn-correct); font-size:14px;">Верно!</span>` : `<br><br><span style="color:var(--btn-wrong); font-size:14px;">Правильный ответ: ${item.year}</span>`;
                handleResult(isCorrect);
            };
            inputArea.appendChild(input); inputArea.appendChild(btn); optionsEl.appendChild(inputArea);
            setTimeout(() => input.focus(), 100);
        }

        function handleResult(isCorrect) {
            if (isCorrect) {
                correctCount++;
                if (gameMode === Infinity) { currentStreak++; updateStreakUI(); }
            } else {
                wrongCount++;
                if (gameMode === Infinity) { currentStreak = 0; updateStreakUI(); }
            }
            document.getElementById('next-btn').classList.add('active');
        }

        function showResult() {
            switchScreen('result-screen');
            const total = correctCount + wrongCount;
            const percent = total === 0 ? 0 : Math.round((correctCount / total) * 100);
            document.getElementById('pie-score').innerText = percent + '%';
            document.getElementById('res-correct').innerText = correctCount;
            document.getElementById('res-wrong').innerText = wrongCount;
            const pie = document.getElementById('pie');
            pie.style.background = `conic-gradient(var(--btn-correct) 0% 0%, var(--btn-wrong) 0% 100%)`;
            setTimeout(() => { pie.style.background = `conic-gradient(var(--btn-correct) 0% ${percent}%, var(--btn-wrong) ${percent}% 100%)`; }, 100);
        }

        loadData();
    </script>
</body>
</html>
